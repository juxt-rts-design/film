# À placer dans /etc/nginx/conf.d/ (contexte http).
# Bloque les scanners type SpiderFoot, sqlmap, nmap, etc.

map $http_user_agent $juxt_bad_bot {
    default 0;
    ~*spiderfoot 1;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*zgrab 1;
    ~*nuclei 1;
    ~*dirbuster 1;
    ~*gobuster 1;
    ~*wfuzz 1;
    ~*ffuf 1;
    ~*acunetix 1;
    ~*nessus 1;
    ~*openvas 1;
    ~*w3af 1;
    ~*whatweb 1;
    ~*webrecon 1;
    ~*httprobe 1;
    ~*httpx 1;
    ~*shodan 1;
    ~*censys 1;
    ~*libwww-perl 1;
    ~*scrapy 1;
    ~*python-requests 1;
    ~*go-http-client 1;
    "" 1;
}
