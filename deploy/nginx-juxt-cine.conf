# Blocs à ajouter dans le server { } de juxt-cine, AVANT le "location / ".
#
# Sans eux, /stream et /download tombent sur try_files -> index.html,
# et le téléchargement renvoie du HTML au lieu du fichier vidéo.

# Résolution du flux (réponse JSON courte)
location /stream {
    proxy_pass http://127.0.0.1:5175;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
}

# Téléchargement : flux long, ne jamais mettre en tampon
location /download {
    proxy_pass http://127.0.0.1:5175;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    # Un épisode HLS peut prendre plusieurs minutes à convertir
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
}

# Proxy média (sous-titres, segments) déjà utilisé par le lecteur
location /proxy {
    proxy_pass http://127.0.0.1:5175;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_buffering off;
    proxy_read_timeout 600s;
}
