# Honeypot / pages interdites — au niveau du server { }, jamais dans /api/.
# include /etc/nginx/snippets/juxt-trap.conf;
# Film : try_files sert /hexaro-trap.html. Anime : Express sert le même fichier.

location ~* ^/(phpmyadmin|pma|wp-admin|wp-login\.php|administrator|admin|\.env|\.git|xmlrpc\.php|phpinfo\.php|server-status|cgi-bin|vendor/phpunit|actuator|console|\.aws) {
