server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 92-222-80-91.sslip.io _;

    root /var/www/juxt-cine;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass https://open-otaku.me/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host open-otaku.me;
        proxy_set_header Referer https://open-otaku.me/;
        proxy_set_header Origin https://open-otaku.me;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
