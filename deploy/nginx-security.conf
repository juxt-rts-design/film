# Snippet à inclure dans le server { } juxt-cine (HTTP + HTTPS).
# include /etc/nginx/snippets/juxt-security.conf;

server_tokens off;

if ($juxt_bad_bot) {
    return 403;
}

include /etc/nginx/snippets/juxt-headers.conf;

location = /robots.txt {
    add_header Content-Type "text/plain; charset=utf-8";
    include /etc/nginx/snippets/juxt-headers.conf;
    try_files /robots.txt =404;
}

location = /sitemap.xml {
    add_header Content-Type "application/xml; charset=utf-8";
    include /etc/nginx/snippets/juxt-headers.conf;
    try_files /sitemap.xml =404;
}
